name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      reuse_build_run_id:
        description: 'Run ID of an existing win-x64-staged artifact to package without rebuilding'
        required: false
        default: ''
  push:
    branches:
      - feature/batch-download-media
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: build-win-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == '' }}
    runs-on: windows-2022
    timeout-minutes: 360

    outputs:
      ayu_version: ${{ steps.meta.outputs.ayu_version }}
      release_version: ${{ steps.meta.outputs.release_version }}
      package_suffix: ${{ steps.meta.outputs.package_suffix }}

    env:
      Platform: x64
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      UPDATES_PRIVATE_KEY: ${{ secrets.UPDATES_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $depsRoot = Split-Path -Parent $workspace
          "DEPS_ROOT=$depsRoot" >> $env:GITHUB_ENV

          $refName = '${{ github.ref_name }}'
          $isTag = ('${{ github.ref }}' -like 'refs/tags/v*')
          if ($isTag) {
            $version = $refName.Substring(1)
            $parts = $version.Split('.')
            $major = if ($parts.Count -gt 0) { [int]$parts[0] } else { 0 }
            $minor = if ($parts.Count -gt 1) { [int]$parts[1] } else { 0 }
            $patch = if ($parts.Count -gt 2) { [int]$parts[2] } else { 0 }
            $appVersionLine = Select-String -Path 'Telegram/build/version' -Pattern '^AppVersion\s+(\d+)' | Select-Object -First 1
            $appVersion = if ($appVersionLine) { [int]$appVersionLine.Matches[0].Groups[1].Value } else { 7002009 }
            $numeric = $appVersion + ($major * 1000000) + ($minor * 1000) + $patch
          } else {
            $version = '0.0.0'
            $numeric = 0
          }
          $suffix = ($refName -replace '[^A-Za-z0-9._-]', '-')

          "AYU_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$numeric" >> $env:GITHUB_ENV
          "ayu_version=$version" >> $env:GITHUB_OUTPUT
          "release_version=$numeric" >> $env:GITHUB_OUTPUT
          "package_suffix=$suffix" >> $env:GITHUB_OUTPUT

      - name: Free disk space
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $paths = @(
            "$env:ProgramFiles\Android",
            "${env:ProgramFiles(x86)}\Android",
            "C:\Android",
            "$env:ProgramFiles\Haskell",
            "C:\tools\ghc*",
            "$env:ProgramFiles\CodeQL",
            "$env:RUNNER_TOOL_CACHE\CodeQL",
            "$env:ProgramFiles\dotnet"
          )
          foreach ($path in $paths) {
            Get-Item $path -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-PSDrive C | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}

      - name: Expand Windows pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "C:"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify toolchain
        shell: pwsh
        run: |
          where.exe cl
          where.exe cmake
          where.exe python
          cl 2>&1 | Select-Object -First 1
          cmake --version
          python --version

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS_ROOT }}/Libraries
            ${{ env.DEPS_ROOT }}/ThirdParty
          key: win-x64-deps-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}
          restore-keys: |
            win-x64-deps-

      - name: Patch MSYS2 package name for CI
        shell: pwsh
        run: |
          $path = 'Telegram/build/prepare/prepare.py'
          $text = Get-Content -Raw -LiteralPath $path
          $patched = $text.Replace('mingw-w64-x86_64-diffutils', 'diffutils')
          Set-Content -LiteralPath $path -Value $patched -NoNewline

      - name: Prepare third-party dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: Telegram\build\prepare\win.bat silent

      - name: Report and trim dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Get-ChildItem $env:DEPS_ROOT -Directory |
            ForEach-Object {
              $size = (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum).Sum
              [pscustomobject]@{
                Name = $_.Name
                SizeGB = [math]::Round($size / 1GB, 2)
              }
            } | Format-Table -AutoSize

          Get-ChildItem $env:DEPS_ROOT -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.zip', '.7z', '.tar', '.gz', '.xz'
            } | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Save dependencies cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS_ROOT }}/Libraries
            ${{ env.DEPS_ROOT }}/ThirdParty
          key: win-x64-deps-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}

      - name: Generate Packer private key header
        shell: pwsh
        run: |
          $isTag = ('${{ github.ref }}' -like 'refs/tags/v*')
          $secret = $env:UPDATES_PRIVATE_KEY
          if ($isTag -and [string]::IsNullOrWhiteSpace($secret)) {
            throw 'UPDATES_PRIVATE_KEY is required for tag releases.'
          }

          $pem = ''
          if (-not [string]::IsNullOrWhiteSpace($secret)) {
            $pemPath = Join-Path $env:RUNNER_TEMP 'updates-private.pem'
            $rsaPath = Join-Path $env:RUNNER_TEMP 'updates-private-rsa.pem'
            [IO.File]::WriteAllText($pemPath, $secret, [Text.UTF8Encoding]::new($false))

            $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
            if (!(Test-Path $openssl)) {
              $openssl = (Get-Command openssl.exe -ErrorAction SilentlyContinue).Source
            }
            if ($openssl) {
              & $openssl rsa -in $pemPath -traditional -out $rsaPath 2>$null
            }
            if ((Test-Path $rsaPath) -and ((Get-Item $rsaPath).Length -gt 0)) {
              $pem = Get-Content -Raw -LiteralPath $rsaPath
            } else {
              $pem = $secret
            }
            Remove-Item $pemPath, $rsaPath -Force -ErrorAction SilentlyContinue
          }

          $escaped = $pem.Replace('\', '\\').Replace('"', '\"')
          $escaped = $escaped.Replace("`r`n", '\n').Replace("`n", '\n')
          $header = 'const char *PrivateKey = "' + $escaped + '";' + "`n" +
            'const char *PrivateBetaKey = "' + $escaped + '";' + "`n" +
            'const char *AlphaPrivateKey = "' + $escaped + '";' + "`n"
          Set-Content -LiteralPath 'Telegram/SourceFiles/_other/packer_private.h' -Value $header -NoNewline

      - name: Validate API secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_ID) -or
              [string]::IsNullOrWhiteSpace($env:API_HASH)) {
            throw 'API_ID and API_HASH secrets must be configured.'
          }

      - name: Configure
        shell: cmd
        working-directory: Telegram
        run: configure.bat -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -DDESKTOP_APP_SPECIAL_TARGET=win64 -DTDESKTOP_API_ID=%API_ID% -DTDESKTOP_API_HASH=%API_HASH% -DDESKTOP_APP_DISABLE_AUTOUPDATE=OFF

      - name: Build Release
        shell: cmd
        run: cmake --build out --target Telegram Updater Packer -j 4

      - name: Remove generated signing header
        if: always()
        shell: pwsh
        run: Remove-Item 'Telegram/SourceFiles/_other/packer_private.h' -Force -ErrorAction SilentlyContinue

      - name: Verify binaries
        shell: pwsh
        run: |
          $output = if (Test-Path 'out/Release/AyuGramMod.exe') {
            'out/Release'
          } elseif (Test-Path 'out/AyuGramMod.exe') {
            'out'
          } else {
            throw 'AyuGramMod.exe was not produced'
          }
          "BUILD_OUTPUT=$output" >> $env:GITHUB_ENV
          foreach ($name in 'AyuGramMod.exe', 'Updater.exe', 'Packer.exe') {
            $path = Join-Path $output $name
            if (!(Test-Path $path)) {
              throw "$name was not produced"
            }
            Get-Item $path | Format-List FullName,Length,LastWriteTime
          }

      - name: Stage deploy directory
        shell: pwsh
        run: |
          $source = $env:BUILD_OUTPUT
          $deploy = 'out/deploy'
          if (Test-Path $deploy) {
            Remove-Item $deploy -Recurse -Force
          }
          New-Item -ItemType Directory -Path $deploy | Out-Null
          New-Item -ItemType Directory -Path 'out/update-package' -Force | Out-Null
          Copy-Item (Join-Path $source 'AyuGramMod.exe') $deploy
          Copy-Item (Join-Path $source 'Updater.exe') $deploy

          $dlls = Get-ChildItem -LiteralPath $source -Filter '*.dll' -File
          if ($dlls) {
            $dlls | Copy-Item -Destination $deploy
          }
          $modules = Join-Path $source 'modules'
          if (Test-Path $modules) {
            Copy-Item $modules $deploy -Recurse
          }

      - name: Build signed native update
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ([int]$env:RELEASE_VERSION -le 0) {
            throw 'Tag must contain a valid numeric version.'
          }
          $source = $env:BUILD_OUTPUT
          $updateDir = 'out/update-package'
          if (Test-Path $updateDir) {
            Remove-Item $updateDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $updateDir | Out-Null

          $deployPath = (Resolve-Path 'out/deploy').Path
          Push-Location $source
          try {
            & (Join-Path (Get-Location) 'Packer.exe') `
              -path $deployPath `
              -target win64 `
              -version $env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) {
              throw 'Packer signing failed.'
            }
          } finally {
            Pop-Location
          }

          $updateFile = Join-Path $source "tx64upd$env:RELEASE_VERSION"
          if (!(Test-Path $updateFile)) {
            throw "Packer output not found: $updateFile"
          }
          Move-Item $updateFile (Join-Path $updateDir "tx64upd$env:RELEASE_VERSION") -Force

      - name: Remove Packer and private key material
        if: always()
        shell: pwsh
        run: |
          if ($env:BUILD_OUTPUT) {
            Remove-Item (Join-Path $env:BUILD_OUTPUT 'Packer.exe') -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:BUILD_OUTPUT 'Packer.pdb') -Force -ErrorAction SilentlyContinue
          }
          Remove-Item 'Telegram/SourceFiles/_other/packer_private.h' -Force -ErrorAction SilentlyContinue

      - name: Upload staged build
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-staged
          if-no-files-found: error
          retention-days: 2
          path: |
            out/deploy
            out/update-package

  package:
    name: Package Windows x64
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.reuse_build_run_id != '')) }}
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Resolve package metadata
        shell: pwsh
        run: |
          $refName = '${{ github.ref_name }}'
          $isTag = ('${{ github.ref }}' -like 'refs/tags/v*')
          if ($isTag) {
            $version = $refName.Substring(1)
            $parts = $version.Split('.')
            $major = if ($parts.Count -gt 0) { [int]$parts[0] } else { 0 }
            $minor = if ($parts.Count -gt 1) { [int]$parts[1] } else { 0 }
            $patch = if ($parts.Count -gt 2) { [int]$parts[2] } else { 0 }
            $appVersionLine = Select-String -Path 'Telegram/build/version' -Pattern '^AppVersion\s+(\d+)' | Select-Object -First 1
            $appVersion = if ($appVersionLine) { [int]$appVersionLine.Matches[0].Groups[1].Value } else { 7002009 }
            $numeric = $appVersion + ($major * 1000000) + ($minor * 1000) + $patch
          } else {
            $version = '0.0.0'
            $numeric = 0
          }
          $suffix = ($refName -replace '[^A-Za-z0-9._-]', '-')
          "AYU_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$numeric" >> $env:GITHUB_ENV
          "PACKAGE_SUFFIX=$suffix" >> $env:GITHUB_ENV

      - name: Download staged build from current run
        if: inputs.reuse_build_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: win-x64-staged
          path: staged

      - name: Download staged build from reusable run
        if: inputs.reuse_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: win-x64-staged
          path: staged
          run-id: ${{ inputs.reuse_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve staged paths
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'staged' -Recurse -Filter 'AyuGramMod.exe' -File |
            Select-Object -First 1
          if (!$exe) {
            throw 'AyuGramMod.exe not found in win-x64-staged.'
          }
          "DEPLOY_DIR=$($exe.Directory.FullName)" >> $env:GITHUB_ENV

          $update = Get-ChildItem 'staged' -Recurse -File -Filter 'tx64upd*' |
            Select-Object -First 1
          if ($update) {
            "UPDATE_FILE=$($update.FullName)" >> $env:GITHUB_ENV
          }

          "PACKAGE_NAME=AyuGramMod-Portable-x64-$env:PACKAGE_SUFFIX" >> $env:GITHUB_ENV
          "SETUP_NAME=AyuGramMod-Setup-x64-$env:PACKAGE_SUFFIX" >> $env:GITHUB_ENV

      - name: Build portable package
        shell: pwsh
        run: |
          $deploy = $env:DEPLOY_DIR
          $stage = 'out/portable'
          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item (Join-Path $deploy '*') $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:PACKAGE_NAME.zip" -Force
          Get-Item "$env:PACKAGE_NAME.zip" | Format-List FullName,Length

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (!$iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (!(Test-Path $iscc)) {
            throw 'Inno Setup ISCC.exe was not found on the runner.'
          }
          $chinese = Join-Path $env:GITHUB_WORKSPACE 'Telegram\build\ChineseSimplified.isl'
          if (!(Test-Path $chinese)) {
            throw 'Bundled ChineseSimplified.isl was not found.'
          }
          $deploy = (Resolve-Path $env:DEPLOY_DIR).Path
          $root = (Get-Location).Path
          & $iscc "/DMyAppVersion=$env:AYU_VERSION" `
            "/DReleasePath=$deploy" `
            "/DOutputDir=$root" `
            "/DOutputBaseFilename=$env:SETUP_NAME" `
            "/DChineseSimplifiedLanguage=$chinese" `
            'Telegram\build\setup_ayu_mod.iss'
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup compilation failed.'
          }
          Get-Item "$env:SETUP_NAME.exe" | Format-List FullName,Length

      - name: Generate current manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FILE) -or
              !(Test-Path $env:UPDATE_FILE)) {
            throw 'Signed update package was not found.'
          }
          $link = Split-Path -Leaf $env:UPDATE_FILE
          if ($link -notmatch '^tx64upd\d+$') {
            throw "Unexpected update package name: $link"
          }
          Copy-Item $env:UPDATE_FILE (Join-Path (Get-Location).Path $link) -Force

          $current = [ordered]@{
            win64 = [ordered]@{
              stable = [ordered]@{
                released = [int]$env:RELEASE_VERSION
                link = $link
              }
            }
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path 'current'),
            $current,
            [Text.UTF8Encoding]::new($false))
          Get-Content 'current'

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: AyuGramMod-Windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            AyuGramMod-Portable-x64-*.zip
            AyuGramMod-Setup-x64-*.exe
            tx64upd*
            current

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AyuGramMod-Portable-x64-*.zip
            AyuGramMod-Setup-x64-*.exe
            tx64upd*
            current
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
