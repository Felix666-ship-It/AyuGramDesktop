name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/batch-download-media

permissions:
  contents: read

concurrency:
  group: build-win-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      Platform: x64
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $paths = @(
            "$env:ProgramFiles\Android",
            "${env:ProgramFiles(x86)}\Android",
            "C:\Android",
            "$env:ProgramFiles\Haskell",
            "C:\tools\ghc*",
            "$env:ProgramFiles\CodeQL",
            "$env:RUNNER_TOOL_CACHE\CodeQL",
            "$env:ProgramFiles\dotnet"
          )
          foreach ($path in $paths) {
            Get-Item $path -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-PSDrive C | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify toolchain
        shell: pwsh
        run: |
          where.exe cl
          where.exe cmake
          where.exe python
          cl 2>&1 | Select-Object -First 1
          cmake --version
          python --version

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ../Libraries
            ../ThirdParty
          key: win-x64-deps-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}
          restore-keys: |
            win-x64-deps-

      - name: Patch MSYS2 package name for CI
        shell: pwsh
        run: |
          $path = 'Telegram/build/prepare/prepare.py'
          $text = Get-Content -Raw -LiteralPath $path
          $patched = $text.Replace('mingw-w64-x86_64-diffutils', 'diffutils')
          Set-Content -LiteralPath $path -Value $patched -NoNewline

      - name: Prepare third-party dependencies
        shell: cmd
        run: Telegram\build\prepare\win.bat silent

      - name: Validate API secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_ID) -or
              [string]::IsNullOrWhiteSpace($env:API_HASH)) {
            throw 'API_ID and API_HASH secrets must be configured.'
          }

      - name: Configure
        shell: cmd
        working-directory: Telegram
        run: configure.bat x64 -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH%

      - name: Build Release
        shell: cmd
        run: cmake --build out --config Release --target Telegram --parallel 4

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'out/Release/AyuGram.exe')) {
            throw 'out/Release/AyuGram.exe was not produced'
          }
          Get-Item 'out/Release/AyuGram.exe' | Format-List FullName,Length,LastWriteTime

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            out/Release/*.exe
            out/Release/*.dll
            out/Release/modules/**